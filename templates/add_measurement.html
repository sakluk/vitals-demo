{% extends "base.html" %}
{% block title %}Lisää mittaus{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h4 mb-3">Lisää mittaus — {{ patient['name'] }}</h1>

        {% if error %}
        <div id="measurement-error" class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label for="param-type" class="form-label">Parametri</label>
                <select id="param-type" name="param-type" class="form-select" required>
                    <option value="HR">HR — Syke (20–300 bpm)</option>
                    <option value="SpO2">SpO2 — Happisaturaatio (50–100 %)</option>
                    <option value="RR">RR — Hengitystaajuus (4–60 /min)</option>
                    <option value="TEMP">TEMP — Lämpötila (30.0–45.0 °C)</option>
                    <option value="NIBP">NIBP — Verenpaine (esim. 120/80 mmHg)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="value" class="form-label">Arvo</label>
                <input type="text" id="value" name="value" class="form-control" required>
            </div>
            <button type="submit" id="save-measurement-btn" class="btn btn-primary">Tallenna</button>
            <a href="{{ url_for('main.patient_detail', patient_id=patient['id']) }}" class="btn btn-link">Peruuta</a>
        </form>
    </div>
</div>
{% endblock %}
