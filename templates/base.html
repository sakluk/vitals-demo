<!doctype html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VitalsDemo{% endblock %} — VitalsDemo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='custom.css') }}" rel="stylesheet">
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.patients_list') }}">VitalsDemo</a>
            <div class="d-flex align-items-center">
                <span id="nav-user-info" class="text-white me-3">
                    {{ current_user.username }} ({{ current_user.role }})
                </span>
                <a id="logout-link" class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">
                    Kirjaudu ulos
                </a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
