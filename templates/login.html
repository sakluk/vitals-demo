{% extends "base.html" %}
{% block title %}Kirjaudu sisään{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-4 text-center">VitalsDemo — Kirjaudu sisään</h1>

        {% if error %}
        <div id="login-error" class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Käyttäjätunnus</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Salasana</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" id="login-btn" class="btn btn-primary w-100">Kirjaudu</button>
        </form>
    </div>
</div>
{% endblock %}
